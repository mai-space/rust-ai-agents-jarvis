<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis AI - Chat Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chat-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 900px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .chat-header .session-id {
            font-size: 12px;
            opacity: 0.9;
            font-family: monospace;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f7f8fa;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.assistant .message-bubble {
            background: white;
            color: #333;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .context-files {
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 12px;
        }

        .context-file-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }

        .context-file-item::before {
            content: "📎";
            margin-right: 5px;
        }

        .input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e5e7eb;
        }

        .file-attachments {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        .file-chip {
            display: inline-flex;
            align-items: center;
            background: #e5e7eb;
            border-radius: 16px;
            padding: 6px 12px;
            font-size: 13px;
            color: #374151;
        }

        .file-chip button {
            background: none;
            border: none;
            margin-left: 8px;
            cursor: pointer;
            font-size: 16px;
            color: #6b7280;
            padding: 0;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .file-chip button:hover {
            color: #ef4444;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        #messageInput {
            width: 100%;
            padding: 12px 50px 12px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 15px;
            resize: none;
            font-family: inherit;
            max-height: 120px;
            transition: border-color 0.2s;
        }

        #messageInput:focus {
            outline: none;
            border-color: #667eea;
        }

        .file-input-btn {
            position: absolute;
            right: 10px;
            bottom: 10px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: #6b7280;
            padding: 5px;
            transition: color 0.2s;
        }

        .file-input-btn:hover {
            color: #667eea;
        }

        #sendButton {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        #sendButton:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: flex;
            gap: 5px;
            padding: 10px;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .loading-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 20px;
        }

        input[type="file"] {
            display: none;
        }

        .new-chat-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div>
                <h1>🤖 Jarvis AI Agent Squad</h1>
                <div class="session-id" id="sessionIdDisplay">New Session</div>
            </div>
            <button class="new-chat-btn" onclick="startNewChat()">New Chat</button>
        </div>
        
        <div class="messages-container" id="messagesContainer">
            <div class="message assistant">
                <div class="message-bubble">
                    👋 Hello! I'm Jarvis, your AI agent squad. I can help you with software development tasks, code analysis, and more. You can attach files for context using the 📎 button below. What would you like me to help you with today?
                </div>
            </div>
        </div>
        
        <div class="input-container">
            <div class="file-attachments" id="fileAttachments"></div>
            <div class="input-row">
                <div class="input-wrapper">
                    <textarea 
                        id="messageInput" 
                        placeholder="Type your message... (Shift+Enter for new line)"
                        rows="1"
                    ></textarea>
                    <input 
                        type="file" 
                        id="fileInput" 
                        multiple 
                        accept=".rs,.js,.ts,.py,.java,.go,.cpp,.c,.h,.hpp,.css,.html,.md,.json,.yaml,.yml,.toml,.txt"
                    >
                    <button class="file-input-btn" onclick="document.getElementById('fileInput').click()">
                        📎
                    </button>
                </div>
                <button id="sendButton" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let sessionId = null;
        let attachedFiles = [];

        // Auto-resize textarea
        const textarea = document.getElementById('messageInput');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Handle Enter key (send message) vs Shift+Enter (new line)
        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Handle file selection
        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            
            for (const file of files) {
                try {
                    const content = await readFileContent(file);
                    attachedFiles.push({
                        path: file.name,
                        content: content
                    });
                    displayFileChip(file.name);
                } catch (error) {
                    showError(`Failed to read file ${file.name}: ${error.message}`);
                }
            }
            
            // Reset file input
            e.target.value = '';
        });

        function readFileContent(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = (e) => reject(e);
                reader.readAsText(file);
            });
        }

        function displayFileChip(filename) {
            const container = document.getElementById('fileAttachments');
            const chip = document.createElement('div');
            chip.className = 'file-chip';
            chip.innerHTML = `
                📄 ${filename}
                <button onclick="removeFile('${filename}')">×</button>
            `;
            container.appendChild(chip);
        }

        function removeFile(filename) {
            attachedFiles = attachedFiles.filter(f => f.path !== filename);
            const container = document.getElementById('fileAttachments');
            const chips = container.querySelectorAll('.file-chip');
            chips.forEach(chip => {
                if (chip.textContent.includes(filename)) {
                    chip.remove();
                }
            });
        }

        function addMessage(role, content, contextFiles = []) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            let contextHtml = '';
            if (contextFiles.length > 0) {
                contextHtml = '<div class="context-files">';
                contextFiles.forEach(file => {
                    contextHtml += `<div class="context-file-item">${file.path}</div>`;
                });
                contextHtml += '</div>';
            }
            
            messageDiv.innerHTML = `
                <div class="message-bubble">
                    ${escapeHtml(content)}
                    ${contextHtml}
                </div>
            `;
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        function showLoading() {
            const container = document.getElementById('messagesContainer');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.id = 'loadingIndicator';
            loadingDiv.innerHTML = `
                <div class="message-bubble">
                    <div class="loading">
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                    </div>
                </div>
            `;
            container.appendChild(loadingDiv);
            container.scrollTop = container.scrollHeight;
        }

        function hideLoading() {
            const loading = document.getElementById('loadingIndicator');
            if (loading) {
                loading.remove();
            }
        }

        function showError(message) {
            const container = document.getElementById('messagesContainer');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            container.appendChild(errorDiv);
            container.scrollTop = container.scrollHeight;
            
            setTimeout(() => errorDiv.remove(), 5000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            const sendButton = document.getElementById('sendButton');
            sendButton.disabled = true;
            
            // Add user message to UI
            addMessage('user', message, attachedFiles);
            
            // Clear input
            input.value = '';
            input.style.height = 'auto';
            
            // Show loading
            showLoading();
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: sessionId,
                        context_files: attachedFiles.length > 0 ? attachedFiles : null
                    })
                });
                
                hideLoading();
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server error: ${errorText}`);
                }
                
                const data = await response.json();
                
                // Update session ID
                if (data.session_id && !sessionId) {
                    sessionId = data.session_id;
                    document.getElementById('sessionIdDisplay').textContent = 
                        `Session: ${sessionId.substring(0, 8)}...`;
                }
                
                // Add assistant response
                addMessage('assistant', data.response);
                
                // Clear attached files after successful send
                attachedFiles = [];
                document.getElementById('fileAttachments').innerHTML = '';
                
            } catch (error) {
                hideLoading();
                showError(`Failed to send message: ${error.message}`);
            } finally {
                sendButton.disabled = false;
            }
        }

        function startNewChat() {
            sessionId = null;
            attachedFiles = [];
            document.getElementById('fileAttachments').innerHTML = '';
            document.getElementById('messagesContainer').innerHTML = `
                <div class="message assistant">
                    <div class="message-bubble">
                        👋 Hello! I'm Jarvis, your AI agent squad. I can help you with software development tasks, code analysis, and more. You can attach files for context using the 📎 button below. What would you like me to help you with today?
                    </div>
                </div>
            `;
            document.getElementById('sessionIdDisplay').textContent = 'New Session';
            document.getElementById('messageInput').value = '';
        }
    </script>
</body>
</html>
